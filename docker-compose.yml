services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # Keep the SQLite database in a named volume so it survives rebuilds.
      DJANGO_DB_PATH: /app/data/db.sqlite3
    volumes:
      - weather_data:/app/data

volumes:
  weather_data:
